name: Bench

# Benchmarks of the pull request against its base, summarised with benchstat into the job
# summary. Advisory only: hosted runners are too noisy for a pass/fail threshold, so read the
# deltas with their confidence intervals, and re-run locally (make bench) before believing a
# small one. Raw outputs are attached as artifacts.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BENCH_COUNT: 6

jobs:
  bench:
    name: benchstat base vs head
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@latest

      - name: benchmark head
        run: go test -run '^$' -bench . -benchmem -count="$BENCH_COUNT" -timeout 35m . | tee head.txt

      - name: benchmark base
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base" ]; then base=$(git rev-parse HEAD~1); fi
          echo "base: $base"
          git worktree add --detach ../base "$base"
          (cd ../base && go test -run '^$' -bench . -benchmem -count="$BENCH_COUNT" -timeout 35m . ) | tee base.txt

      - name: benchstat
        run: |
          {
            echo "## Benchmarks: base vs head (count=$BENCH_COUNT, hosted runner, advisory)"
            echo
            echo '```'
            benchstat base.txt head.txt
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: bench
          path: |
            base.txt
            head.txt
